<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="host-wrap">
      <span class="host-label">Current site</span>
      <div class="host" id="host">loading</div>
    </div>
    <button class="primary" id="toggleAdd">Add flag</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" id="tabSite" type="button" aria-pressed="true">This site</button>
    <button class="tab" id="tabAll" type="button" aria-pressed="false">All</button>
  </nav>

  <div class="notice" id="notice" hidden></div>

  <form class="form" id="form" hidden autocomplete="off">
    <label class="field">
      <span class="label">Cookie name</span>
      <input class="input" id="fName" placeholder="checkout-ab" spellcheck="false">
    </label>
    <label class="field">
      <span class="label">Values</span>
      <input class="input" id="fValues" placeholder="a, b" spellcheck="false">
    </label>
    <label class="field">
      <span class="label">Domain <span class="hint">optional, leave empty for this host</span></span>
      <input class="input" id="fDomain" placeholder=".stage.example.com" spellcheck="false">
    </label>
    <div class="row">
      <button class="primary" id="fSave" type="submit">Save flag</button>
      <button class="ghost text" id="fCancel" type="button">Cancel</button>
    </div>
    <p class="error" id="fError" hidden></p>
  </form>

  <main id="list" class="list"></main>

  <div class="livebar" id="livebar" hidden>
    <span class="live-count" id="liveCount"></span>
    <button class="ghost text danger" id="allOff" type="button">All off</button>
  </div>

  <div class="sr-only" id="status" role="status" aria-live="polite"></div>

  <footer class="bar foot">
    <label class="check">
      <input type="checkbox" id="autoReload">
      <span>Reload on change</span>
    </label>
    <div class="settings">
      <button class="ghost settings-btn" id="settingsBtn" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settingsMenu">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="2.2"/>
          <path d="M13.3 10.1a1.2 1.2 0 0 0 .24 1.33l.04.04a1.45 1.45 0 1 1-2.05 2.05l-.04-.04a1.2 1.2 0 0 0-1.33-.24 1.2 1.2 0 0 0-.73 1.1v.13a1.45 1.45 0 1 1-2.9 0v-.07a1.2 1.2 0 0 0-.79-1.1 1.2 1.2 0 0 0-1.32.24l-.05.04a1.45 1.45 0 1 1-2.05-2.05l.04-.04a1.2 1.2 0 0 0 .24-1.32 1.2 1.2 0 0 0-1.1-.74h-.13a1.45 1.45 0 1 1 0-2.9h.07a1.2 1.2 0 0 0 1.1-.78 1.2 1.2 0 0 0-.24-1.33l-.04-.04a1.45 1.45 0 1 1 2.05-2.05l.04.04a1.2 1.2 0 0 0 1.33.24h.06a1.2 1.2 0 0 0 .73-1.1v-.13a1.45 1.45 0 1 1 2.9 0v.07a1.2 1.2 0 0 0 .73 1.1 1.2 1.2 0 0 0 1.33-.24l.04-.04a1.45 1.45 0 1 1 2.05 2.05l-.04.04a1.2 1.2 0 0 0-.24 1.33v.06a1.2 1.2 0 0 0 1.1.73h.13a1.45 1.45 0 1 1 0 2.9h-.07a1.2 1.2 0 0 0-1.1.73Z"/>
        </svg>
      </button>
      <div class="settings-menu" id="settingsMenu" hidden>
        <button class="ghost text" id="export">Export</button>
        <button class="ghost text" id="importBtn">Import</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
